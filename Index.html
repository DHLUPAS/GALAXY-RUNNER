<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tigrinho Style Game</title>  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#111,#ff7b00);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      padding:20px;
    }

    .app{
      width:100%;
      max-width:420px;
      background:rgba(0,0,0,0.85);
      border-radius:25px;
      padding:25px;
      box-shadow:0 0 35px rgba(0,0,0,0.5);
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .titulo{
      font-size:32px;
      font-weight:bold;
      color:#ffb300;
    }

    .saldo{
      background:#1f1f1f;
      padding:10px 16px;
      border-radius:12px;
      font-weight:bold;
    }

    .slots{
      display:flex;
      justify-content:center;
      gap:10px;
      margin:25px 0;
    }

    .slot{
      width:95px;
      height:95px;
      background:#1b1b1b;
      border:3px solid #ffb300;
      border-radius:15px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:48px;
      transition:0.2s;
    }

    .painel{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:20px;
    }

    .card{
      background:#1b1b1b;
      padding:15px;
      border-radius:15px;
      text-align:center;
    }

    .card h3{
      margin-bottom:8px;
      color:#ffb300;
    }

    .botoes{
      display:flex;
      gap:10px;
      margin-top:20px;
    }

    button{
      flex:1;
      border:none;
      padding:16px;
      border-radius:14px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    .girar{
      background:#ff8800;
      color:white;
    }

    .auto{
      background:#333;
      color:white;
    }

    button:hover{
      transform:scale(1.03);
    }

    .mensagem{
      margin-top:20px;
      text-align:center;
      font-size:20px;
      min-height:30px;
      font-weight:bold;
    }

    .xpbar{
      width:100%;
      height:16px;
      background:#333;
      border-radius:999px;
      overflow:hidden;
      margin-top:10px;
    }

    .xpfill{
      height:100%;
      width:0%;
      background:#00ff88;
      transition:0.3s;
    }

    .ranking{
      margin-top:20px;
      background:#1b1b1b;
      border-radius:15px;
      padding:15px;
    }

    .ranking h2{
      margin-bottom:10px;
      color:#ffb300;
      font-size:22px;
    }

    .ranking li{
      margin:8px 0;
      list-style:none;
    }

    .footer{
      margin-top:20px;
      text-align:center;
      opacity:0.7;
      font-size:13px;
    }
  </style></head>
<body><div class="app">  <div class="topo">
    <div class="titulo">🐯 Tigrinho</div>
    <div class="saldo">💰 <span id="saldo">1000</span></div>
  </div>  <div class="slots">
    <div class="slot" id="s1">🐯</div>
    <div class="slot" id="s2">💎</div>
    <div class="slot" id="s3">🍀</div>
  </div>  <div class="botoes">
    <button class="girar" onclick="girar()">GIRAR</button>
    <button class="auto" onclick="autoSpin()">AUTO</button>
  </div>  <div class="mensagem" id="mensagem"></div>  <div class="painel">
    <div class="card">
      <h3>⭐ Nível</h3>
      <p id="nivel">1</p>
    </div><div class="card">
  <h3>🔥 XP</h3>
  <p id="xptexto">0 / 100</p>
</div>

  </div>  <div class="xpbar">
    <div class="xpfill" id="xpfill"></div>
  </div>  <div class="ranking">
    <h2>🏆 Ranking Fake</h2><ul>
  <li>1. RXZin — 95.000</li>
  <li>2. Magnata — 73.000</li>
  <li>3. Ghost — 61.000</li>
  <li>4. Você — <span id="rankscore">1000</span></li>
</ul>

  </div>  <div class="footer">
    Versão fictícia • Sem apostas reais
  </div></div><script>

const simbolos = ['🐯','💎','🍀','7️⃣','🔥','⭐'];

let saldo = 1000;
let xp = 0;
let nivel = 1;
let auto = false;

function simbolo(){
  return simbolos[Math.floor(Math.random()*simbolos.length)];
}

function atualizar(){
  document.getElementById('saldo').textContent = saldo;
  document.getElementById('rankscore').textContent = saldo;
  document.getElementById('nivel').textContent = nivel;
  document.getElementById('xptexto').textContent = xp + ' / 100';
  document.getElementById('xpfill').style.width = xp + '%';
}

function ganharXP(valor){
  xp += valor;

  if(xp >= 100){
    xp = 0;
    nivel++;
  }

  atualizar();
}

function girar(){

  saldo -= 10;

  const a = simbolo();
  const b = simbolo();
  const c = simbolo();

  document.getElementById('s1').textContent = a;
  document.getElementById('s2').textContent = b;
  document.getElementById('s3').textContent = c;

  const msg = document.getElementById('mensagem');

  if(a === b && b === c){
    saldo += 250;
    ganharXP(25);
    msg.innerHTML = '🎉 JACKPOT +250';
    msg.style.color = '#00ff88';
  }
  else if(a === b || b === c || a === c){
    saldo += 40;
    ganharXP(10);
    msg.innerHTML = '✨ Mini Win +40';
    msg.style.color = '#ffd000';
  }
  else{
    ganharXP(3);
    msg.innerHTML = '😅 Nada dessa vez';
    msg.style.color = 'white';
  }

  if(saldo <= 0){
    saldo = 1000;
    xp = 0;
    nivel = 1;
    msg.innerHTML = '🔄 Reset automático';
  }

  atualizar();
}

function autoSpin(){

  if(auto){
    auto = false;
    return;
  }

  auto = true;

  const intervalo = setInterval(()=>{

    if(!auto){
      clearInterval(intervalo);
      return;
    }

    girar();

  },700);
}

atualizar();

</script></body>
</html>
